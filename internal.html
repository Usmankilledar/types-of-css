<!DOCTYPE html>

    <title>Document</title>
    <style>
        body{

        h2{
            text-align: center;

<body >
    <h2>INTERNAL TYPE OF CSS</h2>
    <p>Internal CSS is a method for defining CSS styles directly within an HTML document. It is particularly useful for applying unique styles to a single web page. Internal CSS is embedded within the style element located in the head section of the HTML file.
    </p>
